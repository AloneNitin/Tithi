name: Build Tithi Calendar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract project ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 4 -type f -iname '*Tithi*Android*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then ZIP=$(find . -maxdepth 4 -type f -iname '*.zip' | head -n 1); fi
          if [ -z "$ZIP" ]; then echo "No project ZIP found"; exit 1; fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          ROOT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ]; then echo "Gradle settings file not found in ZIP"; exit 1; fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found project at $ROOT"

      - name: Force Java and Kotlin JVM 17 in Android app Gradle file
        shell: bash
        run: |
          mkdir -p "$PROJECT_ROOT/app"
          cat > "$PROJECT_ROOT/app/build.gradle.kts" <<'GRADLE'
plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("org.jetbrains.kotlin.plugin.compose")
}

android {
    namespace = "in.tithi.calendar"
    compileSdk = 35
    defaultConfig {
        applicationId = "in.tithi.calendar"
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures { compose = true }
}
kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}
dependencies {
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("androidx.activity:activity-compose:1.10.0")
    implementation(platform("androidx.compose:compose-bom:2024.12.01"))
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.material:material-icons-extended")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
    debugImplementation("androidx.compose.ui:ui-tooling")
}
GRADLE
          echo "Overwrote build file with JVM 17 settings."
          sed -n '1,80p' "$PROJECT_ROOT/app/build.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: cd "$PROJECT_ROOT" && gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TithiCalendar-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
